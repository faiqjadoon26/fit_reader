services:
  - type: web
    name: cycling-dashboard
    env: python
    pythonVersion: 3.11.0          # <-- THIS is the key – NOT under envVars
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fit_reader_db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false

databases:
  - name: fit_reader_db
    plan: free
    databaseName: fit_reader_db
    user: fit_reader_user
