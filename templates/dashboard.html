<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycling App Layout</title>
    <style>
        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b101e;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            min-height: 100vh;
        }

        /* Simulating a Mobile Bottom Sheet */
        .app-panel {
            background-color: #111827; /* Dark background */
            width: 100%;
            max-width: 400px;
            padding: 20px;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            color: white;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Helper for Flex Rows */
        .row {
            display: flex;
            gap: 12px;
            justify-content: space-between;
        }

        /* Box Styles */
        .box {
            flex: 1;
            border-radius: 12px;
            padding: 12px 0;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* 1. Top Row: Timer & Speed (Side by Side) */
        .timer-box {
            background: linear-gradient(180deg, #2a1b19 0%, #3d1f1b 100%);
            border: 1px solid #602f28;
        }

        .speed-box {
            background: linear-gradient(180deg, #14273f 0%, #142e4a 100%);
            border: 1px solid #1c4877;
        }

        /* 2. New Dedicated Distance Row (Full Width) */
        .distance-box {
            background: #151e30;
            border: 1px solid #2a3a58;
            padding: 16px 0; /* More vertical room */
            width: 100%;
            flex: none; /* Override flex:1 to ensure full width */
        }

        /* 3. Secondary Row: HR, Cadence, Power */
        .secondary-box {
            background: #1e2538;
            border: 1px solid #2d3550;
            padding: 12px 0;
        }

        /* Typography and Colors */
        .metric-label {
            font-size: 11px;
            text-transform: uppercase;
            color: #9ca3af;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .metric-unit {
            font-size: 14px;
            font-weight: 400;
            color: #9ca3af;
            margin-left: 2px;
        }

        .metric-distance-value {
            font-size: 32px;
            font-weight: 700;
            color: #10b981; /* Green as seen in original */
        }

        .secondary-value {
            font-size: 14px;
            color: #9ca3af;
        }

        /* Icons */
        .icon-small {
            font-size: 12px;
            margin-right: 4px;
            color: #ffffff80;
        }

        /* 4. Action Buttons Row */
        .action-row {
            display: flex;
            gap: 12px;
            margin-top: 8px;
        }

        .btn {
            flex: 1;
            border: none;
            padding: 16px 10px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-resume {
            background-color: #3978f6;
            color: white;
        }

        .btn-stop {
            background-color: #e34743;
            color: white;
        }

        .btn-discard {
            background-color: #2f3544;
            color: #e5e7eb;
        }
    </style>
</head>
<body>

    <div class="app-panel">
        
        <!-- ROW 1: TIMER & SPEED -->
        <div class="row top-row">
            <div class="box timer-box">
                <div class="metric-label">
                    <span class="icon-small">⏱️</span> TIMER
                </div>
                <div class="metric-value">00:00:12</div>
            </div>
            <div class="box speed-box">
                <div class="metric-label">
                    <span class="icon-small">⚡</span> SPEED
                </div>
                <div class="metric-value">
                    0.1 <span class="metric-unit">km/h</span>
                </div>
            </div>
        </div>

        <!-- ROW 2: NEW DEDICATED FULL-WIDTH DISTANCE ROW -->
        <div class="row distance-row">
            <div class="box distance-box">
                <div class="metric-label">
                    <span class="icon-small">▣</span> DISTANCE
                </div>
                <div class="metric-distance-value">0.00 <span class="metric-unit">km</span></div>
            </div>
        </div>

        <!-- ROW 3: HR, CADENCE, POWER -->
        <div class="row secondary-row">
            <div class="box secondary-box">
                <div class="metric-label"><span class="icon-small">♥</span> HR</div>
                <div class="secondary-value">-- bpm</div>
            </div>
            <div class="box secondary-box">
                <div class="metric-label"><span class="icon-small">↻</span> CADENCE</div>
                <div class="secondary-value">-- rpm</div>
            </div>
            <div class="box secondary-box">
                <div class="metric-label"><span class="icon-small">⚡</span> POWER</div>
                <div class="secondary-value">-- W</div>
            </div>
        </div>

        <!-- ROW 4: ACTION BUTTONS -->
        <div class="action-row">
            <button class="btn btn-resume">▶ Resume</button>
            <button class="btn btn-stop">⏹ Stop</button>
            <button class="btn btn-discard">🗑 Discard</button>
        </div>

    </div>

</body>
</html>
