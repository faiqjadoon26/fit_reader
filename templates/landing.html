<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycling Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .hero { text-align: center; padding: 60px 40px; max-width: 600px; }
        .logo { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 42px; font-weight: 800; margin-bottom: 10px; }
        h1 span { color: #ff4500; }
        p { color: #888; font-size: 18px; margin-bottom: 40px; line-height: 1.6; }
        .login-btn { display: inline-flex; align-items: center; gap: 12px; background: #fff; color: #000; padding: 16px 32px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 16px; transition: transform 0.2s, box-shadow 0.2s; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,255,255,0.15); }
        .login-btn svg { width: 24px; height: 24px; }
        .features { display: flex; gap: 20px; margin-top: 50px; justify-content: center; flex-wrap: wrap; }
        .feature { background: #1a1a1a; padding: 20px; border-radius: 8px; text-align: center; width: 130px; border-bottom: 3px solid #ff4500; }
        .feature .icon { font-size: 28px; margin-bottom: 8px; }
        .feature p { font-size: 12px; color: #aaa; margin: 0; }
    </style>
</head>
<body>
<div class="hero">
    <div class="logo">🚲</div>
    <h1>Cycling <span>Dashboard</span></h1>
    <p>Track your rides, compete with your club, and analyze your performance — all in one place.</p>
    <a href="/auth/login" class="login-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Sign in with GitHub
    </a>
    <div class="features">
        <div class="feature"><div class="icon">📊</div><p>Ride Analytics</p></div>
        <div class="feature"><div class="icon">🗺️</div><p>GPS Route Map</p></div>
        <div class="feature"><div class="icon">🔴</div><p>Live Recording</p></div>
        <div class="feature"><div class="icon">🏆</div><p>Club Leaderboard</p></div>
        <div class="feature"><div class="icon">🔒</div><p>Encrypted Data</p></div>
    </div>
</div>
</body>
</html>
